<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e1a2e" />
    <meta name="description" content="Tu Zanja 3D: arena 3 contra 3 con vista cenital. Juntá 10 núcleos con tu equipo y aguantá la cuenta regresiva." />
    <title>Tu Zanja 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game" aria-label="Arena de juego en 3D"></canvas>
    <div id="world-ui" aria-hidden="true"></div>

    <section id="menu" class="screen">
      <header class="brand">
        <h1><img src="/arte/logo.webp" alt="Tu Zanja 3D" width="900" height="316" /></h1>
        <p>Arena de núcleos · 3 contra 3</p>
      </header>
      <div id="stage"></div>
      <nav id="roster" aria-label="Elegí tu personaje"></nav>
      <aside id="hero-card" class="panel">
        <img id="hc-art" alt="" hidden />
        <div class="hc-head">
          <h2 id="hc-name"></h2>
          <span id="hc-role" class="chip"></span>
        </div>
        <p id="hc-blurb"></p>
        <dl id="hc-bars"></dl>
        <div class="move">
          <span class="k">Ataque</span>
          <b id="hc-atk-name"></b>
          <p id="hc-atk-desc"></p>
        </div>
        <div class="move sup">
          <span class="k">Súper</span>
          <b id="hc-sup-name"></b>
          <p id="hc-sup-desc"></p>
        </div>
      </aside>
      <div class="cta">
        <p class="goal">Juntá <b>10 núcleos</b> con tu equipo y aguantá <b>15 segundos</b>. Si te eliminan, se te caen todos.</p>
        <button id="play" class="btn big" type="button">¡A la arena!</button>
        <p class="keys" id="keys-hint"></p>
        <div class="chips">
          <button id="btn-quality" class="chip-btn" type="button">Gráficos: <b class="q-label"></b></button>
          <button id="btn-gore" class="chip-btn" type="button">Sangre: <b class="g-label"></b></button>
        </div>
      </div>
    </section>

    <section id="hud" hidden>
      <div class="score" aria-live="off">
        <div class="side blue"><i class="hex"></i><b id="score-0">0</b><span class="bar"><i id="bar-0"></i></span></div>
        <div class="goal-n">10</div>
        <div class="side red"><span class="bar"><i id="bar-1"></i></span><b id="score-1">0</b><i class="hex"></i></div>
      </div>
      <div id="banner" hidden></div>
      <div id="big"></div>
      <div id="feed"></div>
      <div class="topbtns">
        <button id="btn-pause" type="button" aria-label="Pausa"><i class="ic-pause"></i></button>
        <button id="btn-mute" type="button" aria-label="Sonido"><i class="ic-sound"></i></button>
      </div>
      <div id="super-meter"><span>Súper</span><div class="track"><i></i></div><kbd>Espacio</kbd></div>
      <div id="respawn" hidden></div>
      <div id="toast" hidden></div>
      <div id="vignette"></div>
      <div id="stick"><i></i></div>
      <div id="btn-super" class="tbtn"><i></i><span>Súper</span></div>
      <div id="btn-attack" class="tbtn"><i></i></div>
    </section>

    <section id="pause" class="overlay" hidden>
      <div class="panel modal">
        <h2>Pausa</h2>
        <p class="keys" id="pause-hint"></p>
        <div class="chips">
          <button id="btn-quality-2" class="chip-btn" type="button">Gráficos: <b class="q-label"></b></button>
          <button id="btn-gore-2" class="chip-btn" type="button">Sangre: <b class="g-label"></b></button>
        </div>
        <button id="resume" class="btn" type="button">Seguir jugando</button>
        <button id="quit" class="btn ghost" type="button">Salir al menú</button>
      </div>
    </section>

    <section id="results" class="overlay" hidden>
      <div class="panel modal wide">
        <h2 id="res-title"></h2>
        <p id="res-sub"></p>
        <div id="res-table"></div>
        <div class="row">
          <button id="again" class="btn" type="button">Revancha</button>
          <button id="change" class="btn ghost" type="button">Cambiar personaje</button>
        </div>
      </div>
    </section>

    <div id="fatal" hidden>
      <p>Tu navegador no pudo iniciar WebGL, que hace falta para el 3D. Probá con otro navegador o activá la aceleración por hardware.</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
